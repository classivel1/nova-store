<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA STORE · Administração</title><style>body{font:16px system-ui;background:#f5f8f6;color:#123d31;margin:0}main{max-width:840px;margin:42px auto;padding:22px}input,button{padding:13px;border-radius:9px;border:1px solid #cbd9d0;font:inherit}input{max-width:100%;width:400px}button{background:#1d594c;color:white;cursor:pointer}section{background:white;border:1px solid #e2ece5;padding:22px;margin:15px 0;border-radius:14px}pre{white-space:pre-wrap;word-break:break-word}</style><main><h1>🛡️ NOVA STORE · Painel Master</h1><p>Área restrita. Informe o token administrativo definido no Render.</p><section><input type="password" id="token" placeholder="Token administrativo"><button id="load">Acessar resumo</button><p id="status"></p></section><section><h2>Indicadores</h2><pre id="summary">Autentique-se para visualizar.</pre></section><section><h2>Fornecedores</h2><input id="name" placeholder="Nome do fornecedor"><button id="add">Cadastrar</button><pre id="suppliers">Nenhum dado carregado.</pre></section><section><h2>Pedidos</h2><pre id="orders">Nenhum dado carregado.</pre></section><p><a href="/">Voltar à loja</a></p></main><script>const $=id=>document.getElementById(id), headers=()=>({'x-admin-token':$('token').value,'content-type':'application/json'});async function get(path){const r=await fetch(path,{headers:headers()});if(!r.ok)throw Error('Não autorizado ou falha de servidor ('+r.status+')');return r.json()}async function load(){try{for(const [p,id] of [['/api/admin/summary','summary'],['/api/admin/suppliers','suppliers'],['/api/admin/orders','orders']])$(id).textContent=JSON.stringify(await get(p),null,2);$('status').textContent='Painel carregado.'}catch(e){$('status').textContent=e.message}}$('load').onclick=load;$('add').onclick=async()=>{const r=await fetch('/api/admin/suppliers',{method:'POST',headers:headers(),body:JSON.stringify({name:$('name').value})});$('status').textContent=r.ok?'Fornecedor cadastrado.':'Erro: '+r.status;if(r.ok)load()};</script></html>
